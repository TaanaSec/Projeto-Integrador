<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel</title>

  <link rel="icon" href="/icon/logo-emporio.ico" type="image/ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="/CSS/restrict/restrict.css">
  <link rel="stylesheet" href="/CSS/restrict/cadastrar-produto/cadastrar-produto.css">
</head>

<body>

  <!-- ════════════════════════════════════════ HEADER ════════════════════════════════════════ -->
  <header class="site-header">
    <a href="/pages/Restrito/restrict.html"><h1 class="header-title">Painel Empório</h1></a>

    <div class="menu-container">
      <button class="btn-hamburguer" id="btnHamburguer" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu-dropdown" id="menuDropdown">

        <a href="/pages/Restrito/dashboard.html" class="link-dashboard">
            <img src="/img/icone-dashboard.png" alt="dashboard">
            <span>Dashboard</span>
        </a>

        <a href="/pages/Restrito/relatorios.html" class="link-relatorios">
            <img src="/img/icone-relatorios.png" alt="relatorios">
            <span>Relatórios</span>
        </a>
        
        <a href="/pages/Restrito/estatisticas.html" class="link-estatisticas">
            <img src="/img/icone-estatisticas.png" alt="estatisticas">
            <span>Estatísticas</span>
        </a>    
        
        <a href="/pages/Restrito/usuarios.html" class="link-usuarios">
            <img src="/img/icone-usuarios.png" alt="usuarios">
            <span>Usuários</span>
        </a>

        <a href="/pages/Restrito/configuracoes.html" class="link-configuracoes">
            <img src="/img/icone-configuracoes.png" alt="Configurações">
            <span>Configurações</span>
        </a>

        <hr>
        
        <button id="btnSair" type="button">
          <img src="/img/icone-sair-logout.png" alt="Sair da Conta">
          <span>Sair da Conta</span>
        </button>
        
      </nav>
    </div>

    <div class="container-perfil">
        <a class="link-perfil" href="/pages/perfil.html">
          <img class="icone-perfil" src="/img/icone-login.png" alt="Área do Perfil"> <!--Fazer aparecer foto do perfil da pessoa-->
          <span>Perfil</span>
        </a>
    </div>

  </header>

  <!-- ════════════════════════════════════════ MAIN ════════════════════════════════════════ -->
  <main class="painel-produtos">

    <section class="cabecalho-pagina">
        <div>
            <h1>Cadastro de Produtos</h1>

            <p>Insira as informações do produto para cadastra-lo.</p>
        </div>

        <button class="botao-criar" id="botaoMostrarFormulario" type="button">
            + Cadastrar produto
        </button>
    </section>

    <section class="resumo-produtos">
        <div class="cartao-resumo">
            <span class="titulo-resumo">Qtde. de Produtos</span>
            <strong id="produtosAtivos">0</strong>
        </div>

        <div class="cartao-resumo">
            <span class="titulo-resumo">Produtos Excluídos</span>
            <strong id="produtosExcluidos">0</strong>
        </div>
    </section>



    <section class="cabecalho-pagina">
        <h1>Cadastrar Produto</h1>
        <p>Preencha os dados abaixo para cadastrar um novo produto.</p>
    </section>

    <section class="cartao-produto" id="areaFormularioProduto" hidden> <!-- MUDAR O ID -->
        <form id="formularioProduto">
            
            <div class="campo">
                <label for="tituloProduto">Título</label>
                
                <input 
                    type="text" 
                    name="titulo" 
                    id="tituloProduto"
                    placeholder="Digite o título do produto"
                    required
                >
            </div>

            <div class="campo">
                <label for="tipoProduto">Tipo do produto</label>

                <select name="tipo" id="tipoProduto" required>
                    <option value="">Selecione uma opção</option>

                    <option value="geleias">
                        Geleias
                    </option>

                    <option value="sucos">
                        Sucos
                    </option>

                    <option value="queijos">
                        Queijos
                    </option>

                    <option value="vinhos">
                        Vinhos
                    </option>

                </select>
            </div>


            <div class="campo">
                <label for="descricaoProduto">Descrição</label>

                <textarea 
                    name="descricao" 
                    id="descricaoProduto"
                    rows="6"
                    placeholder="Digite as informações do produto..."
                    required
                ></textarea>
            </div>

            <div class="botoes-produto">
                <button class="botao-cancelar" id="botaoCancelarProduto" type="button">
                    Cancelar
                </button>

                <button class="botao-cadastrar" type="submit">Cadastrar Produto</button>
            </div>

        </form>

    </section>

  </main>

  <!-- ════════════════════════════════════════ FOOTER ════════════════════════════════════════ -->
  <footer class="site-footer">
    
  </footer>

  <script src="/JS/restrict/menuHamburguer.js"></script>
  <script src="/JS/restrict/logout.js"></script>
  <script src="/JS/admin/adminAuth.js"></script>
  <script src="/JS/restrict/cadastrar-produto.js"></script>

</body>
</html>
