<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel</title>

  <link rel="icon" href="/icon/logo-emporio.ico" type="image/ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="/CSS/restrict/restrict.css">
  <link rel="stylesheet" href="/CSS/restrict/relatorios/relatorios.css">
</head>

<body>

  <!-- ════════════════════════════════════════ HEADER ════════════════════════════════════════ -->
  <header class="site-header">
    <a href="/pages/restrito/restrict.html"><h1 class="header-title">Painel Empório</h1></a>

    <div class="menu-container">
      <button class="btn-hamburguer" id="btnHamburguer" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu-dropdown" id="menuDropdown">

        <a href="/pages/restrito/dashboard.html" class="link-dashboard">
            <img src="/img/icone-dashboard.png" alt="dashboard">
            <span>Dashboard</span>
        </a>

        <a href="/pages/restrito/relatorios.html" class="link-relatorios">
            <img src="/img/icone-relatorios.png" alt="relatorios">
            <span>Relatórios</span>
        </a>

        <a href="/pages/restrito/cadastrar-produto.html" class="link-configuracoes">
            <img src="/img/icone-produtos.png" alt="produtos">
            <span>Produtos</span>
        </a>
        
        <a href="/pages/restrito/estatisticas.html" class="link-estatisticas">
            <img src="/img/icone-estatisticas.png" alt="estatisticas">
            <span>Estatísticas</span>
        </a>    
        
        <a href="/pages/restrito/usuarios.html" class="link-usuarios">
            <img src="/img/icone-usuarios.png" alt="usuarios">
            <span>Usuários</span>
        </a>

        <a href="/pages/restrito/configuracoes.html" class="link-configuracoes">
            <img src="/img/icone-configuracoes.png" alt="Configurações">
            <span>Configurações</span>
        </a>


        <hr>
        
        <button id="btnSair" type="button">
          <img src="/img/icone-sair-logout.png" alt="Sair da Conta">
          <span>Sair da Conta</span>
        </button>
        
      </nav>
    </div>

    <div class="container-perfil">
        <a class="link-perfil" href="/pages/perfil.html">
          <img class="icone-perfil" src="/img/icone-login.png" alt="Área do Perfil"> <!--Fazer aparecer foto do perfil da pessoa-->
          <span>Perfil</span>
        </a>
    </div>

  </header>

  <!-- ════════════════════════════════════════ MAIN ════════════════════════════════════════ -->
  <main class="painel-relatorios">

    <section class="cabecalho-pagina">
        <div>
            <h1>Relatórios</h1>

            <p>Consulte, crie e gerencie os relatorios do sistema.</p>
        </div>

        <button class="botao-criar" id="botaoMostrarFormulario" type="button">
            + Criar Relatório
        </button>
    </section>

    <section class="resumo-relatorios">
        <div class="cartao-resumo">
            <span class="titulo-resumo">Relatório Ativos</span>
            <strong id="relatoriosAtivos">0</strong>
        </div>

        <div class="cartao-resumo">
            <span class="titulo-resumo">Relatórios Excluidos</span>
            <strong id="relatoriosExcluidos">0</strong>
        </div>
    </section>

    <section class="filtros-relatorios">

        <div class="campo-pesquisa">
            <label for="pesquisaRelatorio">Pesquisar relatório</label>
            <input type="search" placeholder="Digite o título do relatório" id="pesquisaRelatorio">
        </div>

        <div class="campo-filtro">
            <label for="filtroTipo">Tipo</label>

            <select id="filtroTipo">
                <option value="">Todos</option>
                <option value="usuarios">Usuários</option>
                <option value="produtos">Produtos</option>
                <option value="vendas">Vendas</option>
                <option value="outros">Outros</option>
            
            </select>

        </div>

    </section>


    <section class="area-relatorios">

        <div class="titulo-secao">
            <h2>Relatórios recentes</h2>
            <span id="qtdResultados">0 relatorios</span>
        </div>

        <div id="listaRelatorios" class="lista-relatorios">
            <!--JS vai colocar os mano aq-->
        </div>

    </section>







    <section class="cartao-relatorio" id="areaFormularioRelatorio" hidden>
        <form id="formularioRelatorio">
            
        <section class="cabecalho-pagina">
            <h1>Criar Relatório</h1>
        </section>
            
            <div class="campo">
                <label for="tituloRelatorio">Título</label>
                
                <input 
                    type="text" 
                    name="titulo" 
                    id="tituloRelatorio"
                    placeholder="Digite o título do relatório"
                    required
                >
            </div>

            <div class="campo">
                <label for="tipoRelatorio">Tipo do relatório</label>

                <select name="tipo" id="tipoRelatorio" required>
                    <option value="">Selecione uma opção</option>

                    <option value="usuarios">
                        Usuários
                    </option>

                    <option value="produtos">
                        Produtos
                    </option>

                    <option value="vendas">
                        Vendas
                    </option>

                    <option value="outros">
                        Outros
                    </option>


                </select>
            </div>

            <div class="linha-campos">

                <div class="campo">
                    <label for="dataInicial">Data inicial</label>

                    <input 
                        type="date" 
                        name="dataInicial"
                        id="dataInicial"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="dataFinal">Data final</label>

                    <input 
                        type="date" 
                        name="dataFinal" 
                        id="dataFinal"
                        required
                    >
                </div>

            </div>

            <div class="campo">
                <label for="descricaoRelatorio">Descrição</label>

                <textarea 
                    name="descricao" 
                    id="descricaoRelatorio"
                    rows="6"
                    placeholder="Digite as informações do relatório..."
                    required
                ></textarea>
            </div>

            <div class="botoes-relatorio">
                <button class="botao-cancelar" id="botaoCancelarFormulario" type="button">
                    Cancelar
                </button>

                <button class="botao-criar" type="submit">Criar Relatório</button>
            </div>

        </form>

    </section>

  </main>

  <!-- ════════════════════════════════════════ FOOTER ════════════════════════════════════════ -->
  <footer class="site-footer">
    
  </footer>

  <script src="/JS/restrict/menuHamburguer.js"></script>
  <script src="/JS/restrict/logout.js"></script>
  <script src="/JS/admin/adminAuth.js"></script>
  <script src="/JS/restrict/relatorios.js"></script>

</body>
</html>
